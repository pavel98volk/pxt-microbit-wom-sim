<script type="text/javascript">
(function() {
    if (typeof window === "undefined" || !window.location) return;
    const isHosted = !/^(localhost|127\.0\.0\.1)/.test(window.location.hostname);

    // 1. Force pxt.Cloud.apiRoot to always point to MakeCode cloud API on hosted deployments
    window.pxt = window.pxt || {};
    window.pxt.Cloud = window.pxt.Cloud || {};
    let _apiRoot = "https://www.makecode.com/api/";
    try {
        Object.defineProperty(window.pxt.Cloud, "apiRoot", {
            get: function() {
                return _apiRoot;
            },
            set: function(v) {
                if (isHosted && (!v || v.startsWith("/"))) {
                    _apiRoot = "https://www.makecode.com/api/";
                    return;
                }
                _apiRoot = v;
            },
            configurable: true,
            enumerable: true
        });
    } catch (e) {
        window.pxt.Cloud.apiRoot = _apiRoot;
    }

    if (!isHosted) return;

    // Helper to rewrite root-relative URLs on hosted deployments (e.g. GitHub Pages)
    function rewriteUrl(url) {
        if (!url || typeof url !== "string") return url;
        // Rewrite /api/... or https://<domain>/api/... to https://www.makecode.com/api/...
        if (url.startsWith("/api/")) {
            return "https://www.makecode.com" + url;
        }
        if (url.startsWith(window.location.origin + "/api/")) {
            return "https://www.makecode.com" + url.slice(window.location.origin.length);
        }
        // Rewrite /static/... or https://<domain>/static/... to https://makecode.microbit.org/static/...
        if (url.startsWith("/static/")) {
            return "https://makecode.microbit.org" + url;
        }
        if (url.startsWith(window.location.origin + "/static/")) {
            return "https://makecode.microbit.org" + url.slice(window.location.origin.length);
        }
        return url;
    }

    // 2. Intercept fetch for /api/ and /static/
    if (window.fetch) {
        const origFetch = window.fetch;
        window.fetch = function(input, init) {
            try {
                if (typeof input === "string") {
                    input = rewriteUrl(input);
                } else if (input && input.url) {
                    input = new Request(rewriteUrl(input.url), input);
                }
            } catch (e) {}
            return origFetch.call(this, input, init);
        };
    }

    // 3. Intercept XMLHttpRequest for /api/ and /static/
    if (window.XMLHttpRequest) {
        const origOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url) {
            try {
                arguments[1] = rewriteUrl(url);
            } catch (e) {}
            return origOpen.apply(this, arguments);
        };
    }

    // 4. Intercept setAttribute for image src / data-src
    const origSetAttr = Element.prototype.setAttribute;
    Element.prototype.setAttribute = function(name, val) {
        if (typeof val === "string") {
            if ((name === "src" || name === "data-src" || name === "href") && (val.startsWith("/static/") || val.startsWith(window.location.origin + "/static/"))) {
                val = rewriteUrl(val);
            }
        }
        return origSetAttr.call(this, name, val);
    };

    // 5. MutationObserver to rewrite CSS background-image or lazy-loaded cards
    const staticObserver = new MutationObserver(mutations => {
        for (let i = 0; i < mutations.length; i++) {
            const m = mutations[i];
            if (m.type === "attributes" && m.attributeName === "style") {
                const target = m.target;
                if (target && target.style && target.style.backgroundImage && target.style.backgroundImage.indexOf("/static/") !== -1) {
                    target.style.backgroundImage = target.style.backgroundImage.replace(/url\(["']?(\/static\/[^"']+)["']?\)/g, (full, path) => {
                        return 'url("' + rewriteUrl(path) + '")';
                    });
                }
            } else if (m.type === "childList") {
                for (let j = 0; j < m.addedNodes.length; j++) {
                    const node = m.addedNodes[j];
                    if (node.nodeType === 1) {
                        const el = node;
                        if (el.dataset && el.dataset.src && el.dataset.src.startsWith("/static/")) {
                            el.dataset.src = rewriteUrl(el.dataset.src);
                        }
                        if (el.tagName === "IMG" && el.src && el.src.startsWith(window.location.origin + "/static/")) {
                            el.src = rewriteUrl(el.src);
                        }
                    }
                }
            }
        }
    });

    window.addEventListener("DOMContentLoaded", () => {
        staticObserver.observe(document.documentElement, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ["style", "data-src", "src"]
        });
    });
})();
</script>

<script type="text/javascript">
window.addEventListener("DOMContentLoaded", () => {
    let hidden = false;
    
    // Observe the rootdir to see if we are in the homescreen or not. If
    // we leave the home screen, hide the usabilla overlay
    const observer = new MutationObserver((mutationList) => {
        for (const mutation of mutationList) {
            if (mutation.type === "attributes") {
                const root = document.getElementById("root");

                if (root.classList.contains("inHome")) {
                    if (hidden) {
                        hidden = false;
                        const el = document.querySelector("div.usabilla__overlay");
                        if (el) el.style.display = "";
                    }
                }
                else if (!hidden) {
                    hidden = true;
                    const el = document.querySelector("div.usabilla__overlay");
                    if (el) el.style.display = "none";
                }
            }
        }
    });

    // Just poll until react has had time to render the root div
    let interval = setInterval(() => {
        const root = document.getElementById("root");

        if (root) {
            clearInterval(interval);
            observer.observe(root, { attributes: true, attributeFilter: ["class"] });
        }
    }, 500);
});
</script>
