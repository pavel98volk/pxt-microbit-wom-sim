<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <!-- Cold slate drop shadow -->
    <filter id="coldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.8" flood-color="#334155" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#coldShadow)">
    <!-- Antenna: vertical pole with round beacon bulb on top -->
    <line x1="12" y1="5" x2="12" y2="2.2" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="12" cy="1.8" r="1.4" fill="#94a3b8" stroke="#334155" stroke-width="0.6"/>

    <!-- Ear bolts on sides of robot head -->
    <rect x="2.2" y="8" width="2" height="4" rx="0.8" fill="#64748b" stroke="#334155" stroke-width="0.6"/>
    <rect x="19.8" y="8" width="2" height="4" rx="0.8" fill="#64748b" stroke="#334155" stroke-width="0.6"/>

    <!-- Boxy robot head with cold slate grey tone with subtle blue tint -->
    <rect x="4" y="5" width="16" height="10.5" rx="2" fill="#64748b" stroke="#334155" stroke-width="1"/>

    <!-- Eye visor frame -->
    <rect x="6" y="7" width="12" height="4.2" rx="1.2" fill="#1e293b"/>
    <!-- Circular robot eyes with cold blue tint -->
    <circle cx="8.8" cy="9.1" r="1.4" fill="#93c5fd"/>
    <circle cx="15.2" cy="9.1" r="1.4" fill="#93c5fd"/>
    <circle cx="9.2" cy="8.7" r="0.45" fill="#ffffff"/>
    <circle cx="15.6" cy="8.7" r="0.45" fill="#ffffff"/>

    <!-- Slotted robot mouth / speaker grille -->
    <line x1="8" y1="13" x2="16" y2="13" stroke="#334155" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="9.5" y1="12.4" x2="9.5" y2="13.6" stroke="#334155" stroke-width="0.6"/>
    <line x1="12" y1="12.4" x2="12" y2="13.6" stroke="#334155" stroke-width="0.6"/>
    <line x1="14.5" y1="12.4" x2="14.5" y2="13.6" stroke="#334155" stroke-width="0.6"/>

    <!-- Mechanical neck connector -->
    <rect x="10.5" y="15.5" width="3" height="1.5" fill="#475569" stroke="#334155" stroke-width="0.6"/>

    <!-- Torso shoulders / chassis base -->
    <path d="M 3.5,22 L 6,17 L 18,17 L 20.5,22 Z" fill="#64748b" stroke="#334155" stroke-width="1" stroke-linejoin="round"/>
    <!-- Chest status indicator -->
    <rect x="9" y="18.2" width="6" height="2.2" rx="0.6" fill="#334155"/>
    <line x1="10.5" y1="19.3" x2="13.5" y2="19.3" stroke="#93c5fd" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>